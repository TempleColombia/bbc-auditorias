<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BBC Auditorías — Coordinadores</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--surface:#141416;--surface2:#1e1e21;--border:#2a2a2e;--text:#f0f0f0;--muted:#777;--accent:#f5a623;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}

/* Header */
.header{background:linear-gradient(135deg,#0a0a0b 0%,#141416 100%);border-bottom:1px solid var(--border);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.logo-area{display:flex;align-items:center;gap:14px}
.logo-img{width:40px;height:40px;object-fit:contain;filter:invert(1)}
.brand-name{font-size:18px;font-weight:700;letter-spacing:-0.02em;color:var(--text)}
.brand-sub{font-size:12px;color:var(--muted)}
.header-right{display:flex;align-items:center;gap:12px}
.update-badge{font-size:11px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);padding:5px 12px;border-radius:20px}
.refresh-btn{background:var(--accent);color:#000;border:none;border-radius:10px;padding:8px 16px;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer}
.refresh-btn:hover{opacity:.9}

/* Container */
.container{padding:24px;max-width:1200px;margin:0 auto}

/* Loading */
.loading{text-align:center;padding:80px 20px;color:var(--muted)}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* KPI grid */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
@media(max-width:768px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
.kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.kpi-val{font-family:var(--mono);font-size:28px;font-weight:500}
.kpi-card.k-total .kpi-val{color:var(--text)}
.kpi-card.k-prom .kpi-val{color:var(--accent)}
.kpi-card.k-verde .kpi-val{color:var(--green)}
.kpi-card.k-amarillo .kpi-val{color:var(--yellow)}
.kpi-card.k-rojo .kpi-val{color:var(--red)}

/* Section titles */
.section-title{font-size:13px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* Módulos grid */
.mod-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:24px}
@media(max-width:900px){.mod-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:500px){.mod-grid{grid-template-columns:repeat(2,1fr)}}
.mod-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 10px;text-align:center}
.mod-name{font-size:10px;color:var(--muted);margin-bottom:6px;line-height:1.3}
.mod-score{font-family:var(--mono);font-size:20px;font-weight:500}
.mod-max{font-size:10px;color:var(--muted)}
.mod-bar{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.mod-bar-fill{height:100%;border-radius:2px;transition:width .5s}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{padding:10px 18px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none}.tab-content.active{display:block}

/* Table */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600}
.badge-verde{background:#14532d;color:#86efac}
.badge-amarillo{background:#713f12;color:#fde68a}
.badge-rojo{background:#7f1d1d;color:#fca5a5}
.badge-pendiente{background:#1e2a1a;color:#86efac}
.score-cell{font-family:var(--mono);font-weight:500;text-align:center}
.medal{font-size:16px}
.prio-alta{color:var(--red);font-weight:600}
.prio-media{color:var(--yellow)}

/* Alarm cards */
.alarm-list{display:flex;flex-direction:column;gap:10px}
.alarm-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.alarm-card.alta{border-left:3px solid var(--red)}
.alarm-card.media{border-left:3px solid var(--yellow)}
.alarm-pdv{font-size:13px;font-weight:600;margin-bottom:4px}
.alarm-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:8px}
.alarm-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:10px;padding:3px 8px;border-radius:5px;background:var(--surface2);color:var(--muted);font-weight:500}

/* Module detail */
.mod-detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:600px){.mod-detail-grid{grid-template-columns:1fr}}
.mod-detail-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.mod-detail-header{padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.mod-detail-name{font-size:13px;font-weight:600}
.mod-detail-prom{font-family:var(--mono);font-size:13px;color:var(--accent)}
.mod-detail-body{padding:12px 16px}
.mod-detail-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.mod-detail-row:last-child{border-bottom:none}
.mod-detail-pdv{color:var(--text)}
.mod-detail-score{font-family:var(--mono);font-size:12px;font-weight:500}

/* Zona filter buttons */
.zona-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-family:var(--font);font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s}
.zona-btn:hover{border-color:var(--accent);color:var(--text)}
.zona-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}

/* Highlight cards */
.highlight-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:12px;padding:14px 16px}
.hl-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.hl-val{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl-sub{font-family:var(--mono);font-size:12px;color:var(--accent)}
@media(max-width:768px){.highlight-card{grid-column:span 2}}

/* Footer */
.footer{text-align:center;padding:24px;color:var(--muted);font-size:11px;border-top:1px solid var(--border);margin-top:32px}
</style>
</head>

<script>
// ── CONFIGURACIÓN ──
// Reemplaza con tu Sheet ID y una API Key de Google
const SHEET_ID = '15snwnCCKLXjPlYSP6UN-TWiMqQJTr-OBYzp6mYIdv_Y';
// Para leer el Sheet públicamente necesitas una Google API Key
// Ve a console.cloud.google.com → APIs → Sheets API → Credentials → Create API Key
// Pégala aquí:
const API_KEY = 'AIzaSyDb8oVRMOSoPtXJ7kdvth6Dzxl-ica2M7s';

const MOD_NOMBRES = ['Experiencia','Marketing','Finanzas','Inventario','Operaciones','Mantenimiento','Ventas'];
const MOD_MAX = [15,15,15,15,15,15,10];

let todosLosDatos = [];
let zonaActiva = 'TODAS';
let coordActivo = 'TODOS';

async function cargarDatos(){
  document.getElementById('loading').style.display='block';
  document.getElementById('app').style.display='none';
  try {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Auditorías!A2:DZ1000?key=${API_KEY}`;
    const r = await fetch(url);
    const d = await r.json();
    if(d.error){throw new Error(d.error.message);}
    todosLosDatos = d.values || [];
    renderApp();
  } catch(e){
    document.getElementById('loading').innerHTML = `<div style="color:#ef4444;font-size:14px">Error al cargar datos: ${e.message}<br><br><small>Verifica que la API Key esté configurada y el Sheet sea público.</small></div>`;
  }
}

function col(row, i){ return (row && row[i]) ? String(row[i]).trim() : ''; }
function num(row, i){ return parseFloat(col(row,i)) || 0; }

const I = {
  tsEnvio:1, pdv:5, zona:6, coord:7, tipo:8,
  s1:18, s2:29, s3:40, s4:53, s5:76, s6:91, s7:104,
  total:105, estado:106, hallazgos:107, notas:108
};
const MOD_I = [I.s1,I.s2,I.s3,I.s4,I.s5,I.s6,I.s7];

function estado(row){ return col(row,I.estado).toUpperCase(); }

function filtrarPorZona(data){
  let result = data;
  if(zonaActiva!=='TODAS') result = result.filter(r=>col(r,I.zona).toUpperCase().includes(zonaActiva.toUpperCase()));
  if(coordActivo!=='TODOS') result = result.filter(r=>col(r,I.coord).toUpperCase()===coordActivo.toUpperCase());
  return result;
}

function renderApp(){
  const todasZonas = [...new Set(todosLosDatos.map(r=>col(r,I.zona)).filter(Boolean))].sort();
  const todosCoords = [...new Set(todosLosDatos.map(r=>col(r,I.coord)).filter(Boolean))].sort();
  const data = filtrarPorZona(todosLosDatos);
  if(!data.length){ document.getElementById('loading').innerHTML='<div>Sin auditorías para esta zona.</div>'; return; }

  const totales = data.map(r=>num(r,I.total));
  const prom = totales.length ? Math.round(totales.reduce((a,b)=>a+b,0)/totales.length) : 0;
  const verdes = data.filter(r=>estado(r)==='VERDE').length;
  const amars = data.filter(r=>estado(r)==='AMARILLO').length;
  const rojos = data.filter(r=>estado(r)==='ROJO').length;

  // Última por PDV
  const ultimas = {};
  data.forEach(r=>{ const p=col(r,I.pdv); if(!ultimas[p]||col(r,I.tsEnvio)>col(ultimas[p],I.tsEnvio)) ultimas[p]=r; });
  const ranking = Object.values(ultimas).sort((a,b)=>num(b,I.total)-num(a,I.total));

  // Promedios por módulo
  const modProms = MOD_I.map((idx,i)=>{
    const vals = data.map(r=>num(r,idx)).filter(v=>v>0);
    return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
  });

  // Módulo más débil
  const modDebil = modProms.reduce((minI,v,i,arr)=>v/MOD_MAX[i]<arr[minI]/MOD_MAX[minI]?i:minI,0);
  const modFuerte = modProms.reduce((maxI,v,i,arr)=>v/MOD_MAX[i]>arr[maxI]/MOD_MAX[maxI]?i:maxI,0);

  // ── Cumplimiento mensual por zona ──
  const hoy = new Date();
  const mesActual = hoy.getFullYear()+'-'+(String(hoy.getMonth()+1).padStart(2,'0'));
  const mesActualES = (String(hoy.getMonth()+1).padStart(2,'0'))+'/'+hoy.getFullYear(); // formato dd/mm/yyyy → mm/yyyy

  // PDVs auditados este mes por zona
  const auditadosMes = {};
  todosLosDatos.forEach(r=>{
    const tsRaw = col(r,I.tsEnvio); // puede ser "14/05/2026 06:33" o "2026-05-14"
    let esMes = false;
    if(tsRaw.includes('/')){ // formato dd/mm/yyyy
      const partes = tsRaw.split('/');
      if(partes.length>=3) esMes = partes[1]===String(hoy.getMonth()+1).padStart(2,'0') && partes[2].substring(0,4)===String(hoy.getFullYear());
    } else { // formato yyyy-mm-dd
      esMes = tsRaw.substring(0,7)===mesActual;
    }
    const zona = col(r,I.zona);
    const pdv = col(r,I.pdv);
    if(esMes && zona){
      if(!auditadosMes[zona]) auditadosMes[zona]=new Set();
      auditadosMes[zona].add(pdv);
    }
  });

  // Total PDVs por zona (de todos los datos históricos)
  const totalPorZona = {};
  todosLosDatos.forEach(r=>{
    const zona = col(r,I.zona);
    const pdv = col(r,I.pdv);
    if(zona && pdv){
      if(!totalPorZona[zona]) totalPorZona[zona]=new Set();
      totalPorZona[zona].add(pdv);
    }
  });

  const zonasUnicas = Object.keys(totalPorZona).sort();
  const mesNombre = hoy.toLocaleString('es-CO',{month:'long',year:'numeric'});

  // Alarmas — solo de última auditoría por PDV
  const alarmas = [];
  Object.values(ultimas).forEach(r=>{
    const h = col(r,I.hallazgos);
    if(h){ h.split(' | ').forEach(hh=>{ if(hh.trim()) alarmas.push({pdv:col(r,I.pdv),zona:col(r,I.zona),desc:hh.trim(),tipo:'Hallazgo',fecha:col(r,I.tsEnvio).substring(0,10)}); }); }
    MOD_I.forEach((idx,i)=>{ const s=num(r,idx); if(s>0&&s/MOD_MAX[i]<0.70) alarmas.push({pdv:col(r,I.pdv),zona:col(r,I.zona),desc:'Puntaje bajo en '+MOD_NOMBRES[i]+': '+s+'/'+MOD_MAX[i]+' ('+Math.round(s/MOD_MAX[i]*100)+'%)',tipo:MOD_NOMBRES[i],fecha:col(r,I.tsEnvio).substring(0,10)}); });
  });

  document.getElementById('update-time').textContent = 'Actualizado: '+new Date().toLocaleString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';

  document.getElementById('app').innerHTML = `
    <!-- Filtros -->
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;width:90px">Zona</span>
        <button class="zona-btn ${zonaActiva==='TODAS'?'active':''}" onclick="setZona('TODAS')">Todas</button>
        ${todasZonas.map(z=>`<button class="zona-btn ${zonaActiva===z?'active':''}" onclick="setZona('${z}')">${z}</button>`).join('')}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;width:90px">Coordinador</span>
        <button class="zona-btn ${coordActivo==='TODOS'?'active':''}" onclick="setCoord('TODOS')">Todos</button>
        ${todosCoords.map(c=>`<button class="zona-btn ${coordActivo===c?'active':''}" onclick="setCoord('${c}')">${c}</button>`).join('')}
      </div>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi-card k-total"><div class="kpi-label">Auditorías</div><div class="kpi-val">${data.length}</div></div>
      <div class="kpi-card k-prom"><div class="kpi-label">Promedio</div><div class="kpi-val">${prom}/100</div></div>
      <div class="kpi-card k-verde"><div class="kpi-label">🟢 Verde ≥85</div><div class="kpi-val">${verdes}</div></div>
      <div class="kpi-card k-amarillo"><div class="kpi-label">🟡 Amarillo</div><div class="kpi-val">${amars}</div></div>
      <div class="kpi-card k-rojo"><div class="kpi-label">🔴 Rojo &lt;70</div><div class="kpi-val">${rojos}</div></div>
    </div>

    <!-- Highlights -->
    <div class="section-title">⚡ Highlights</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px">
      <div class="highlight-card" style="border-left-color:#22c55e">
        <div class="hl-label">🥇 Mejor PDV</div>
        <div class="hl-val">${mejorPDV?col(mejorPDV,I.pdv):'—'}</div>
        <div class="hl-sub">${mejorPDV?num(mejorPDV,I.total)+'/100':''}</div>
      </div>
      <div class="highlight-card" style="border-left-color:#ef4444">
        <div class="hl-label">⚠️ Necesita atención</div>
        <div class="hl-val">${peorPDV?col(peorPDV,I.pdv):'—'}</div>
        <div class="hl-sub">${peorPDV?num(peorPDV,I.total)+'/100':''}</div>
      </div>
      <div class="highlight-card" style="border-left-color:#22c55e">
        <div class="hl-label">💪 Módulo más fuerte</div>
        <div class="hl-val">${MOD_NOMBRES[modFuerte]}</div>
        <div class="hl-sub">${modProms[modFuerte]}/${MOD_MAX[modFuerte]} prom.</div>
      </div>
      <div class="highlight-card" style="border-left-color:#ef4444">
        <div class="hl-label">📉 Módulo más débil</div>
        <div class="hl-val">${MOD_NOMBRES[modDebil]}</div>
        <div class="hl-sub">${modProms[modDebil]}/${MOD_MAX[modDebil]} prom.</div>
      </div>
    </div>

    <!-- Cumplimiento mensual -->
    <div class="section-title">📅 Cumplimiento de auditorías — ${mesNombre}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:24px">
      ${zonasUnicas.map(zona=>{
        const total = totalPorZona[zona]?totalPorZona[zona].size:0;
        const auditados = auditadosMes[zona]?auditadosMes[zona].size:0;
        const pct = total>0?Math.round(auditados/total*100):0;
        const color = pct>=100?'#22c55e':pct>=50?'#eab308':'#ef4444';
        const emoji = pct>=100?'✅':pct>=50?'⚠️':'🔴';
        // PDVs sin auditar este mes
        const sinAuditar = total - auditados;
        return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
            <div>
              <div style="font-size:12px;font-weight:600;color:var(--text)">${zona}</div>
              <div style="font-size:10px;color:var(--muted);margin-top:2px">${auditados} de ${total} PDVs auditados</div>
            </div>
            <div style="font-size:20px">${emoji}</div>
          </div>
          <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:8px">
            <div style="height:100%;width:${pct}%;background:${color};border-radius:3px;transition:width .5s"></div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-family:var(--mono);font-size:18px;font-weight:500;color:${color}">${pct}%</span>
            ${sinAuditar>0?`<span style="font-size:10px;color:#ef4444;background:#7f1d1d22;padding:2px 8px;border-radius:5px">${sinAuditar} pendientes</span>`:'<span style="font-size:10px;color:#22c55e">¡Completo!</span>'}
          </div>
        </div>`;
      }).join('')}
    </div>

    <!-- Alertas resumen -->
    ${alarmas.length>0?`
    <div class="section-title">🚨 Alertas activas (${alarmas.length})</div>
    <div style="background:var(--surface);border:1px solid #3a1a1a;border-radius:12px;padding:14px 16px;margin-bottom:24px">
      <div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap">
        <span style="font-size:12px;background:#7f1d1d;color:#fca5a5;padding:4px 12px;border-radius:6px;font-weight:600">${alarmas.filter(a=>a.tipo==='Hallazgo').length} hallazgos</span>
        <span style="font-size:12px;background:#713f12;color:#fde68a;padding:4px 12px;border-radius:6px;font-weight:600">${alarmas.filter(a=>a.tipo!=='Hallazgo').length} módulos con puntaje bajo</span>
        <span style="font-size:12px;color:var(--muted)">${[...new Set(alarmas.map(a=>a.pdv))].length} PDVs afectados</span>
      </div>
      <div style="max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:6px">
        ${alarmas.slice(0,10).map(a=>`
          <div style="display:flex;align-items:flex-start;gap:10px;padding:8px 10px;background:var(--surface2);border-radius:8px">
            <span style="font-size:10px;color:var(--muted);white-space:nowrap;margin-top:1px">${a.fecha}</span>
            <div style="flex:1;min-width:0">
              <span style="font-size:11px;font-weight:600;color:var(--accent)">${a.pdv}</span>
              <span style="font-size:11px;color:var(--text);margin-left:6px">${a.desc.length>80?a.desc.substring(0,80)+'…':a.desc}</span>
            </div>
            <span style="font-size:10px;color:var(--muted);white-space:nowrap">${a.zona}</span>
          </div>`).join('')}
        ${alarmas.length>10?`<div style="text-align:center;font-size:11px;color:var(--muted);padding:4px">+${alarmas.length-10} más — ver tab Alarmas</div>`:''}
      </div>
    </div>`:''}

    <!-- Módulos -->
    <div class="section-title">📈 Promedio por módulo</div>
    <div class="mod-grid" style="margin-bottom:28px">
      ${MOD_NOMBRES.map((n,i)=>{
        const p=modProms[i]; const pct=p/MOD_MAX[i];
        const c=pct>=0.85?'#22c55e':pct>=0.70?'#eab308':'#ef4444';
        return `<div class="mod-card">
          <div class="mod-name">${n}</div>
          <div class="mod-score" style="color:${c}">${p}</div>
          <div class="mod-max">/ ${MOD_MAX[i]}</div>
          <div class="mod-bar"><div class="mod-bar-fill" style="width:${pct*100}%;background:${c}"></div></div>
        </div>`;
      }).join('')}
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" onclick="switchTab('ranking',this)">🏆 Ranking (${ranking.length})</div>
      <div class="tab" onclick="switchTab('modulos',this)">🔍 Por módulo</div>
      <div class="tab" onclick="switchTab('alarmas',this)">⚠️ Todas las alarmas (${alarmas.length})</div>
    </div>

    <!-- Ranking -->
    <div id="tab-ranking" class="tab-content active">
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>PDV</th><th>Zona</th><th>Tipo</th><th>Última auditoría</th>${MOD_NOMBRES.map(n=>`<th title="${n}">${n.substring(0,4)}.</th>`).join('')}<th>Total</th><th>Estado</th></tr></thead>
          <tbody>
            ${ranking.map((r,i)=>{
              const t=num(r,I.total); const est=estado(r);
              const badge=est==='VERDE'?'badge-verde':est==='AMARILLO'?'badge-amarillo':'badge-rojo';
              const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
              const scores=MOD_I.map((idx,mi)=>{const s=num(r,idx);const pct=s/MOD_MAX[mi];const c=pct>=0.85?'#22c55e':pct>=0.70?'#eab308':'#ef4444';return `<td class="score-cell" style="color:${c}">${s}</td>`;}).join('');
              return `<tr><td class="medal">${medal}</td><td style="font-weight:500">${col(r,I.pdv)}</td><td style="font-size:11px">${col(r,I.zona)}</td><td style="font-size:11px">${col(r,I.tipo)}</td><td style="color:var(--muted);font-size:11px">${col(r,I.tsEnvio).substring(0,16)}</td>${scores}<td class="score-cell" style="font-size:15px;font-weight:700">${t}</td><td><span class="badge ${badge}">${est==='VERDE'?'🟢':est==='AMARILLO'?'🟡':'🔴'} ${est}</span></td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Por módulo -->
    <div id="tab-modulos" class="tab-content">
      <div class="mod-detail-grid">
        ${MOD_NOMBRES.map((nombre,mi)=>{
          const idx=MOD_I[mi]; const max=MOD_MAX[mi];
          const porPDV={};
          data.forEach(r=>{const p=col(r,I.pdv);const s=num(r,idx);if(!porPDV[p]||s<porPDV[p])porPDV[p]=s;});
          const peores=Object.entries(porPDV).sort((a,b)=>a[1]-b[1]).slice(0,5);
          const p=modProms[mi]; const pct=p/max;
          const c=pct>=0.85?'#22c55e':pct>=0.70?'#eab308':'#ef4444';
          return `<div class="mod-detail-card">
            <div class="mod-detail-header">
              <div class="mod-detail-name">${nombre}</div>
              <div class="mod-detail-prom" style="color:${c}">${p}/${max} prom.</div>
            </div>
            <div class="mod-detail-body">
              ${peores.map(p=>{
                const pp=p[1]/max; const cc=pp>=0.85?'#22c55e':pp>=0.70?'#eab308':'#ef4444';
                return `<div class="mod-detail-row"><span class="mod-detail-pdv" style="font-size:11px">${p[0]}</span><span class="mod-detail-score" style="color:${cc}">${p[1]}/${max}</span></div>`;
              }).join('')}
              ${peores.length===0?'<div class="empty">Sin datos</div>':''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- Todas las alarmas -->
    <div id="tab-alarmas" class="tab-content">
      ${alarmas.length===0?'<div class="empty">✅ Sin alarmas activas</div>':''}
      <div class="alarm-list">
        ${alarmas.map(a=>`<div class="alarm-card media">
          <div class="alarm-pdv">${a.pdv} <span style="font-size:10px;color:var(--muted);font-weight:400">${a.zona}</span></div>
          <div class="alarm-desc">${a.desc}</div>
          <div class="alarm-meta">
            <span class="tag">${a.tipo}</span>
            <span class="tag" style="color:var(--muted)">${a.fecha}</span>
          </div>
        </div>`).join('')}
      </div>
    </div>
  `;
}

function setZona(zona){
  zonaActiva = zona;
  renderApp();
}

function setCoord(coord){
  coordActivo = coord;
  renderApp();
}

function switchTab(name, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

cargarDatos();
</script>
</body>
</html>
