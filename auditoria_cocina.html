<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light">
<title>Auditoría de Cocina · BBC Colombia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{color-scheme:light;
  --green:#1b4332;--green-light:#2e8b57;--green-pale:#e8f5e9;
  --amber:#e65100;--amber-pale:#fff3e0;--red:#b71c1c;--red-pale:#ffebee;
  --blue:#1565c0;--blue-pale:#e3f2fd;
  --gray:#546e7a;--gray-light:#eceff1;--border:#e8dcc0;
  --text:#2b2018;--white:#fff;--shadow:0 2px 8px rgba(0,0,0,.12);
  --accent:#F59E0B;--accent-dark:#c9790a;--beige:#F3E7CC;--beige-pale:#FBF6EA;--text-strong:#2b2018;
}
body{font-family:Arial,Helvetica,sans-serif;background:var(--beige-pale);color:var(--text);font-size:14px;padding-bottom:90px}
a{color:inherit}

/* HEADER PERMANENTE */
.app-header{position:sticky;top:0;z-index:50;background:var(--beige);color:var(--text-strong);box-shadow:var(--shadow)}
.app-header .logo-img{height:28px;display:block}
.app-header-top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px}
.app-header h1{font-size:15px;font-weight:700;letter-spacing:.2px}
.app-header .sub{font-size:11px;opacity:.8;margin-top:1px}
.hdr-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.hdr-btn{background:rgba(43,32,24,.08);border:1px solid rgba(43,32,24,.2);color:var(--text-strong);border-radius:8px;padding:6px 9px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.hdr-btn:active{background:rgba(255,255,255,.28)}
.progress-ring{position:relative;width:38px;height:38px;flex-shrink:0}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);overflow-x:auto}
.tab-btn{flex:1;padding:11px 6px;font-size:11px;font-weight:700;color:var(--gray);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab-btn.active{color:var(--accent-dark);border-bottom-color:var(--accent)}
.tab-btn:disabled{opacity:.4}

.content{max-width:720px;margin:0 auto;padding:16px}
.tab-pane{display:none}
.tab-pane.active{display:block}

.card{background:#fff;border-radius:10px;box-shadow:var(--shadow);margin-bottom:14px}
.card-header{background:var(--accent);color:#fff;padding:10px 16px;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:10px 10px 0 0}
.card-body{padding:16px}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.form-group{display:flex;flex-direction:column}
.form-group label{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{border:1px solid var(--border);border-radius:6px;padding:9px 10px;font-size:14px;color:var(--text);background:#fff;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,158,11,.15)}
.form-group.full{grid-column:1/-1}
.autocomplete-wrap{position:relative}
.autocomplete-list{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;box-shadow:var(--shadow);z-index:40;max-height:200px;overflow-y:auto}
.autocomplete-list.show{display:block}
.autocomplete-item{padding:10px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--gray-light)}
.autocomplete-item:last-child{border-bottom:none}
.autocomplete-item:active{background:var(--green-pale)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:8px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--accent);color:var(--text-strong)}
.btn-secondary{background:var(--gray-light);color:var(--text)}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* EVALUACIÓN — un ítem a la vez */
.item-progress{font-size:12px;color:var(--gray);font-weight:700;margin-bottom:6px}
.item-card{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:20px;min-height:calc(100vh - 260px);display:flex;flex-direction:column}
.item-cat{font-size:11px;font-weight:700;color:var(--green-light);text-transform:uppercase;letter-spacing:.5px}
.item-name{font-size:19px;font-weight:800;margin:6px 0 4px;line-height:1.3}
.item-max{font-size:12px;color:var(--gray);margin-bottom:18px}
.score-options{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.score-option{display:flex;align-items:center;gap:10px;border:2px solid var(--border);border-radius:10px;padding:14px;min-height:48px;cursor:pointer;font-weight:700;font-size:14px}
.score-option .icon{font-size:18px}
.score-cumple{background:var(--green-pale)}
.score-cumple.selected{border-color:var(--green-light);background:#c8e6c9}
.score-parcial{background:var(--amber-pale)}
.score-parcial.selected{border-color:var(--amber);background:#ffe0b2}
.score-nocumple{background:var(--red-pale)}
.score-nocumple.selected{border-color:var(--red);background:#ffcdd2}
.score-noaplica{background:#e3f2fd}
.score-noaplica.selected{border-color:var(--blue);background:#bbdefb}
.obs-label{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;margin-bottom:6px}
.obs-input{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;min-height:70px;font-family:inherit;resize:vertical}
.foto-btn{margin-top:10px;background:var(--gray-light);border:1px dashed var(--gray);border-radius:8px;padding:10px;font-size:12px;font-weight:700;color:var(--gray);cursor:pointer;text-align:center}
.foto-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.foto-thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.foto-thumb img{width:100%;height:100%;object-fit:cover}
.foto-thumb .del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;cursor:pointer}
.item-nav{display:flex;gap:10px;margin-top:auto;padding-top:16px}
.score-bar-wrap{background:var(--gray-light);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--gray);margin-bottom:12px}
.score-bar-wrap b{color:var(--accent-dark);font-size:15px}

/* EVIDENCIAS TAB */
.evidencia-cat-title{font-size:12px;font-weight:800;color:var(--accent-dark);text-transform:uppercase;margin:14px 0 6px}
.evidencia-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.evidencia-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
.empty-note{color:var(--gray);font-size:13px;padding:20px;text-align:center}

/* HALLAZGOS */
.hallazgo-card{border-left:4px solid var(--red);margin-bottom:12px}
.hallazgo-card.recomendacion{border-left-color:var(--blue)}
.hallazgo-card .card-header{display:flex;justify-content:space-between;align-items:center;background:var(--red)}
.hallazgo-card.recomendacion .card-header{background:var(--blue)}
.badge-tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.25)}
.categoria-vacia{opacity:.5;padding:10px 16px;font-size:12px;color:var(--gray);background:#fff;border-radius:8px;margin-bottom:8px}

/* RESUMEN */
.score-global{text-align:center;padding:24px}
.score-global .num{font-size:52px;font-weight:900;line-height:1}
.score-global .clas{font-size:16px;font-weight:800;margin-top:6px;padding:4px 14px;border-radius:20px;display:inline-block}
.clas-excelente{background:#1b5e20;color:#fff}
.clas-bien{background:#c8e6c9;color:#1b5e20}
.clas-porMejorar{background:#fff9c4;color:#8d6e00}
.clas-regular{background:#ffe0b2;color:#a94500}
.clas-critico{background:#ffcdd2;color:#b71c1c}
.mod-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);font-size:13px}
.mod-row:last-child{border-bottom:none}
.mod-row .pct{font-weight:800}

/* INFORME / IMPRESIÓN */
.acta-actions{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.acta-actions .btn{flex:1;min-width:140px}
#acta-print{display:none}
table.acta-tabla{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
table.acta-tabla th,table.acta-tabla td{border:1px solid #ccc;padding:6px 8px;text-align:left}
table.acta-tabla th{background:var(--accent);color:#fff}
.firma-box{display:flex;gap:24px;margin-top:40px}
.firma-linea{flex:1;border-top:1px solid #333;padding-top:6px;text-align:center;font-size:12px}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#212121;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:12px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;padding:20px}
.modal-box h3{margin-bottom:12px;font-size:16px}
.draft-item{border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer}
.draft-item:active{background:var(--gray-light)}
.draft-item .pdv{font-weight:700;font-size:13px}
.draft-item .meta{font-size:11px;color:var(--gray)}

@media print{
  body *{visibility:hidden}
  #acta-print,#acta-print *{visibility:visible}
  #acta-print{display:block !important;position:absolute;top:0;left:0;width:100%;padding:20px}
  .app-header,.tabs{display:none !important}
}
</style>
</head>

function leerDB(){ try{ return JSON.parse(localStorage.getItem(LS_DB)||'[]'); }catch(e){ return []; } }
function guardarDB(arr){ localStorage.setItem(LS_DB, JSON.stringify(arr)); }
function leerConfig(){ try{ return JSON.parse(localStorage.getItem(LS_CONFIG)||'{}'); }catch(e){ return {}; } }
function guardarConfig(cfg){ localStorage.setItem(LS_CONFIG, JSON.stringify(cfg)); }

function migrarDatosLegacy(){
  const cfg = leerConfig();
  if (cfg.migradoDesdeLegacy) return;
  try{
    const legacyDb = JSON.parse(localStorage.getItem(LEGACY_DB) || 'null');
    if (Array.isArray(legacyDb) && legacyDb.length){
      const actual = leerDB();
      const idsActuales = new Set(actual.map(r=>r.id));
      let migrados = 0;
      legacyDb.forEach(r=>{
        const id = r.id || ('legacy_'+Math.random().toString(36).slice(2));
        if (!idsActuales.has(id)){
          actual.push({...r, id, origen:'migrado_legacy'});
          migrados++;
        }
      });
      guardarDB(actual);
      if (migrados) console.info('[BBC Cocina] Migrados '+migrados+' registros desde localStorage legacy "auditoria_db". Los datos originales NO se borraron.');
    }
    const legacyCfg = JSON.parse(localStorage.getItem(LEGACY_CONFIG) || 'null');
    if (legacyCfg && typeof legacyCfg === 'object'){
      const nuevaCfg = {...legacyCfg, ...cfg};
      nuevaCfg.migradoDesdeLegacy = true;
      guardarConfig(nuevaCfg);
      return;
    }
  }catch(e){ console.warn('Migración legacy falló', e); }
  cfg.migradoDesdeLegacy = true;
  guardarConfig(cfg);
}

// ═══ IndexedDB: fotos ═══
let idbConn = null;
function abrirIDB(){
  return new Promise((resolve,reject)=>{
    if (idbConn) return resolve(idbConn);
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('fotos')) db.createObjectStore('fotos', {keyPath:'key'});
    };
    req.onsuccess = e => { idbConn = e.target.result; resolve(idbConn); };
    req.onerror = e => reject(e);
  });
}
async function guardarFoto(key, dataUrl){
  const db = await abrirIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('fotos','readwrite');
    tx.objectStore('fotos').put({key, dataUrl});
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = reject;
  });
}
async function leerFoto(key){
  const db = await abrirIDB();
  return new Promise((resolve)=>{
    const tx = db.transaction('fotos','readonly');
    const req = tx.objectStore('fotos').get(key);
    req.onsuccess = ()=>resolve(req.result ? req.result.dataUrl : null);
    req.onerror = ()=>resolve(null);
  });
}
async function borrarFoto(key){
  const db = await abrirIDB();
  return new Promise((resolve)=>{
    const tx = db.transaction('fotos','readwrite');
    tx.objectStore('fotos').delete(key);
    tx.oncomplete = ()=>resolve(true);
  });
}

// ═══ Utilidades ═══
function uid(){ return Date.now().toString() + Math.random().toString(36).slice(2,7); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function clasificar(pct){
  const u = SCHEMA.umbrales;
  if (pct >= u.excelente) return {label:'Excelente', css:'clas-excelente'};
  if (pct >= u.bien) return {label:'Bien', css:'clas-bien'};
  if (pct >= u.porMejorar) return {label:'Por mejorar', css:'clas-porMejorar'};
  if (pct >= u.regular) return {label:'Regular', css:'clas-regular'};
  return {label:'Crítico', css:'clas-critico'};
}
function calcularScorePorCategoria(catId){
  const items = ITEMS_FLAT.filter(i=>i.categoriaId===catId);
  let obtenido=0, max=0;
  const sinCalificar = items.some(i=>!state.items[i.id] || !state.items[i.id].calificacion);
  items.forEach(i=>{
    const ev = state.items[i.id];
    if (!ev || ev.calificacion === 'no_aplica' || !ev.calificacion) return;
    max += i.pts;
    if (ev.calificacion==='cumple') obtenido += i.pts;
    else if (ev.calificacion==='parcial') obtenido += i.pts*0.5;
  });
  const estado = sinCalificar ? 'pendiente' : (max>0 ? 'evaluado' : 'no_aplica');
  return {obtenido, max, pct: max>0 ? (obtenido/max*100) : null, estado};
}
function calcularScoreGlobal(){
  let obtenido=0, max=0;
  ITEMS_FLAT.forEach(i=>{
    const ev = state.items[i.id];
    if (!ev || ev.calificacion === 'no_aplica' || !ev.calificacion) return;
    max += i.pts;
    if (ev.calificacion==='cumple') obtenido += i.pts;
    else if (ev.calificacion==='parcial') obtenido += i.pts*0.5;
  });
  return {obtenido, max, pct: max>0 ? (obtenido/max*100) : 0};
}
function avanceItems(){
  const respondidos = ITEMS_FLAT.filter(i=>state.items[i.id] && state.items[i.id].calificacion).length;
  return Math.round(respondidos / ITEMS_FLAT.length * 100);
}
function actualizarAnillo(){
  const pct = avanceItems();
  const circ = 2*Math.PI*16;
  const ring = document.getElementById('ring-progress');
  ring.setAttribute('stroke-dasharray', circ.toFixed(1));
  ring.setAttribute('stroke-dashoffset', (circ*(1-pct/100)).toFixed(1));
  document.getElementById('ring-pct').textContent = pct+'%';
}

// ═══ UI Controller ═══
const AppUI = {

  init(){
    migrarDatosLegacy();
    this.sembrarAuditoresBase();
    this.sembrarPDVsBase();
    const cfg = leerConfig();
    document.getElementById('g-auditor').value = cfg.auditorDefault || '';
    document.getElementById('g-fecha').value = new Date().toISOString().slice(0,10);
    document.getElementById('g-hora').value = new Date().toTimeString().slice(0,5);
    this.setupAutocomplete('g-pdv', 'pdvsConocidos', (nombre)=>this.autocompletarDatosPDV(nombre));
    this.setupAutocomplete('g-auditor', 'auditoresConocidos');
    this.cargarBorradorActivo();
    actualizarAnillo();
  },

  // Autocompletar propio (no usamos <datalist> nativo: en iOS/Android móvil
  // el datalist con frecuencia no muestra ninguna sugerencia visible)
  setupAutocomplete(inputId, configKey, onSelect){
    const input = document.getElementById(inputId);
    const list = document.getElementById('ac-' + inputId);
    const mostrar = (filtro)=>{
      const cfg = leerConfig();
      const opciones = (cfg[configKey] || []);
      const texto = (filtro||'').toLowerCase().trim();
      const filtradas = texto ? opciones.filter(o=>o.toLowerCase().includes(texto)) : opciones;
      if (!filtradas.length){ list.classList.remove('show'); list.innerHTML=''; return; }
      list.innerHTML = filtradas.slice(0,8).map(o=>`<div class="autocomplete-item">${o}</div>`).join('');
      list.classList.add('show');
    };
    input.addEventListener('focus', ()=>mostrar(input.value));
    input.addEventListener('input', ()=>mostrar(input.value));
    input.addEventListener('blur', ()=>setTimeout(()=>list.classList.remove('show'), 200));
    list.addEventListener('mousedown', (e)=>{
      const item = e.target.closest('.autocomplete-item');
      if (!item) return;
      input.value = item.textContent;
      list.classList.remove('show');
      if (onSelect) onSelect(item.textContent);
    });
  },

  // Al elegir un PDV de la lista, precarga Tipo PDV / Modalidad / Coordinador
  // según el listado maestro — así todos quedan consistentes automáticamente
  autocompletarDatosPDV(nombre){
    const pdv = PDVS_BASE.find(p => p.nombre === nombre);
    if (!pdv) return;
    if (pdv.tipoPdv) document.getElementById('g-tipoPdv').value = pdv.tipoPdv;
    if (pdv.modalidad) document.getElementById('g-modalidad').value = pdv.modalidad;
    const sinTildes = (s)=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const coordSelect = document.getElementById('g-coordinadorZona');
    const coordNorm = sinTildes((pdv.coordinador || '').toLowerCase());
    for (const opt of coordSelect.options){
      if (opt.value && coordNorm.includes(sinTildes(opt.value.toLowerCase().split(' ')[0]))){
        coordSelect.value = opt.value;
        break;
      }
    }
  },

  sembrarAuditoresBase(){
    const cfg = leerConfig();
    const actuales = cfg.auditoresConocidos || [];
    const faltantes = AUDITORES_BASE.filter(a => !actuales.includes(a));
    if (faltantes.length){
      cfg.auditoresConocidos = [...actuales, ...faltantes];
      guardarConfig(cfg);
    }
  },

  sembrarPDVsBase(){
    const cfg = leerConfig();
    const actuales = cfg.pdvsConocidos || [];
    const nombresBase = PDVS_BASE.map(p => p.nombre);
    const faltantes = nombresBase.filter(n => !actuales.includes(n));
    if (faltantes.length){
      cfg.pdvsConocidos = [...actuales, ...faltantes];
      guardarConfig(cfg);
    }
  },

  recordarValor(configKey, valor){
    if (!valor) return;
    const cfg = leerConfig();
    cfg[configKey] = cfg[configKey] || [];
    if (!cfg[configKey].includes(valor)){
      cfg[configKey].unshift(valor);
      cfg[configKey] = cfg[configKey].slice(0,50);
    }
    guardarConfig(cfg);
  },

  irATab(n){
    if (n>1 && !state.id){ toast('Primero completa los datos del PDV y comienza la evaluación'); return; }
    if (n>=3 && avanceItems()<100){ toast('Debes calificar los ' + ITEMS_FLAT.length + ' ítems antes de continuar (' + avanceItems() + '% completado)'); return; }
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab==String(n)));
    document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
    document.getElementById('pane-'+n).classList.add('active');
    if (n===2) this.renderEvidencias();
    if (n===3) this.renderHallazgos();
    if (n===4) this.renderResumen();
    if (n===5) this.renderInforme();
  },

  leerDatosGenerales(){
    ['pdv','fecha','hora','auditor','manager','jefeCocina','coordinadorZona','receptor','tipoPdv','modalidad'].forEach(k=>{
      state.datos[k] = document.getElementById('g-'+k).value;
    });
  },

  comenzarEvaluacion(){
    if (!state.id){
      // Fecha/hora se fijan al momento real de iniciar, con la hora del dispositivo — no editable
      document.getElementById('g-fecha').value = new Date().toISOString().slice(0,10);
      document.getElementById('g-hora').value = new Date().toTimeString().slice(0,5);
    }
    this.leerDatosGenerales();
    if (!state.datos.pdv){ toast('Ingresa el PDV antes de continuar'); return; }
    if (!state.id){ state.id = uid(); state.creadoEn = new Date().toISOString(); }
    this.recordarValor('pdvsConocidos', state.datos.pdv);
    this.recordarValor('auditoresConocidos', state.datos.auditor);
    const cfg = leerConfig(); cfg.auditorDefault = state.datos.auditor; guardarConfig(cfg);
    document.getElementById('evaluacion-wrap').style.display = 'block';
    document.getElementById('datos-generales-card').querySelector('.btn').textContent = 'Datos guardados ✓ — edítalos arriba si es necesario';
    this.renderItemActual();
    this.guardarProgreso(false);
  },

  renderItemActual(){
    const i = ITEMS_FLAT[state.itemIndex];
    const ev = state.items[i.id] || {calificacion:null, observacion:'', fotos:[]};
    document.getElementById('item-progress-label').textContent = `Ítem ${state.itemIndex+1} de ${ITEMS_FLAT.length} — ${i.categoriaNombre}`;
    const card = document.getElementById('item-card');
    card.innerHTML = `
      <div class="item-cat">${i.categoriaNombre}</div>
      <div class="item-name">${i.nombre}</div>
      <div class="item-max">Puntaje máximo: ${i.pts} pts</div>
      <div class="score-options">
        <div class="score-option score-cumple ${ev.calificacion==='cumple'?'selected':''}" onclick="AppUI.calificar('cumple')"><span class="icon">✓</span> Cumple <span style="margin-left:auto;font-weight:800">${i.pts} pts</span></div>
        <div class="score-option score-parcial ${ev.calificacion==='parcial'?'selected':''}" onclick="AppUI.calificar('parcial')"><span class="icon">≈</span> Cumple parcialmente <span style="margin-left:auto;font-weight:800">${(i.pts*0.5)} pts</span></div>
        <div class="score-option score-nocumple ${ev.calificacion==='no_cumple'?'selected':''}" onclick="AppUI.calificar('no_cumple')"><span class="icon">✕</span> No cumple <span style="margin-left:auto;font-weight:800">0 pts</span></div>
        <div class="score-option score-noaplica ${ev.calificacion==='no_aplica'?'selected':''}" onclick="AppUI.calificar('no_aplica')"><span class="icon">—</span> No aplica <span style="margin-left:auto;font-weight:800">excluido</span></div>
      </div>
      <div class="obs-label">Observaciones</div>
      <textarea class="obs-input" id="item-obs" placeholder="Cumple, pero… / No cumple porque… / No aplica, pero debe implementarse cuando…">${ev.observacion||''}</textarea>
      <div class="foto-btn" onclick="document.getElementById('item-foto-input').click()">📷 Agregar foto de evidencia</div>
      <input type="file" id="item-foto-input" accept="image/*" capture="environment" style="display:none" onchange="AppUI.agregarFoto(event)">
      <div class="foto-grid" id="item-foto-grid"></div>
      <div class="item-nav">
        <button class="btn btn-secondary" ${state.itemIndex===0?'disabled':''} onclick="AppUI.navegarItem(-1)">← Atrás</button>
        <button class="btn btn-primary" style="flex:1" onclick="AppUI.navegarItem(1)">${state.itemIndex===ITEMS_FLAT.length-1?'Ir a Evidencias →':'Siguiente →'}</button>
      </div>
    `;
    document.getElementById('item-obs').addEventListener('input', e=>{
      state.items[i.id] = state.items[i.id] || {calificacion:null, observacion:'', fotos:[]};
      state.items[i.id].observacion = e.target.value;
    });
    this.renderFotosItem(i.id);
    this.actualizarScoreBar();
  },

  async renderFotosItem(itemId){
    const grid = document.getElementById('item-foto-grid');
    const ev = state.items[itemId];
    if (!ev || !ev.fotos || !ev.fotos.length){ grid.innerHTML=''; return; }
    grid.innerHTML = '';
    for (const key of ev.fotos){
      const dataUrl = await leerFoto(key);
      if (!dataUrl) continue;
      const div = document.createElement('div');
      div.className = 'foto-thumb';
      div.innerHTML = `<img src="${dataUrl}"><button class="del" onclick="AppUI.eliminarFoto('${itemId}','${key}')">✕</button>`;
      grid.appendChild(div);
    }
  },

  async agregarFoto(e){
    const file = e.target.files[0];
    e.target.value = ''; // limpiar de una vez: si falla, el input no queda "atascado"
    if (!file) return;
    const max = 800;
    try{
      let bitmap;
      if (window.createImageBitmap){
        try{
          const probe = await createImageBitmap(file);
          const scale = Math.min(1, max/Math.max(probe.width, probe.height));
          bitmap = await createImageBitmap(file, {resizeWidth:Math.round(probe.width*scale), resizeHeight:Math.round(probe.height*scale), resizeQuality:'medium'});
          probe.close && probe.close();
        }catch(_){ bitmap = null; }
      }
      const canvas = document.createElement('canvas');
      let w, h;
      if (bitmap){
        w = bitmap.width; h = bitmap.height;
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
        bitmap.close && bitmap.close();
      } else {
        const dataUrl = await new Promise((res, rej)=>{
          const reader = new FileReader();
          reader.onload = ev=>res(ev.target.result);
          reader.onerror = ()=>rej(new Error('No se pudo leer el archivo'));
          reader.readAsDataURL(file);
        });
        const img = await new Promise((res, rej)=>{
          const im = new Image();
          im.onload = ()=>res(im);
          im.onerror = ()=>rej(new Error('No se pudo procesar la imagen'));
          im.src = dataUrl;
        });
        w = img.width; h = img.height;
        if (w > max){ h = h*max/w; w = max; }
        if (h > max){ w = w*max/h; h = max; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      }
      const b64 = canvas.toDataURL('image/jpeg', 0.7);
      const i = ITEMS_FLAT[state.itemIndex];
      const key = state.id+'_'+i.id+'_'+uid();
      await guardarFoto(key, b64);
      state.items[i.id] = state.items[i.id] || {calificacion:null, observacion:'', fotos:[]};
      state.items[i.id].fotos.push(key);
      this.renderFotosItem(i.id);
    }catch(err){
      toast('⚠ No se pudo cargar la foto (memoria insuficiente) — intenta con una foto más liviana');
    }
  },

  async eliminarFoto(itemId, key){
    await borrarFoto(key);
    state.items[itemId].fotos = state.items[itemId].fotos.filter(k=>k!==key);
    this.renderFotosItem(itemId);
  },

  calificar(valor){
    const i = ITEMS_FLAT[state.itemIndex];
    state.items[i.id] = state.items[i.id] || {calificacion:null, observacion:'', fotos:[]};
    state.items[i.id].calificacion = valor;
    if (!state.items[i.id].observacion){
      const obsEl = document.getElementById('item-obs');
      state.items[i.id].observacion = obsEl ? obsEl.value : '';
    }
    this.renderItemActual();
    actualizarAnillo();
  },

  navegarItem(delta){
    const obsEl = document.getElementById('item-obs');
    const i = ITEMS_FLAT[state.itemIndex];
    if (obsEl){
      state.items[i.id] = state.items[i.id] || {calificacion:null, observacion:'', fotos:[]};
      state.items[i.id].observacion = obsEl.value;
    }
    if (delta > 0){
      const ev = state.items[i.id];
      if (!ev || !ev.calificacion){
        toast('Selecciona una calificación antes de continuar');
        return;
      }
      if (ev.calificacion === 'no_cumple' && (!ev.observacion || !ev.observacion.trim())){
        toast('Escribe la observación: ¿por qué no cumple?');
        if (obsEl) obsEl.focus();
        return;
      }
    }
    const nuevo = state.itemIndex + delta;
    if (nuevo < 0) return;
    if (nuevo >= ITEMS_FLAT.length){ this.irATab(2); return; }
    state.itemIndex = nuevo;
    this.renderItemActual();
    this.guardarProgreso(false);
  },

  actualizarScoreBar(){
    const s = calcularScoreGlobal();
    document.getElementById('score-acumulado').textContent = `${s.obtenido.toFixed(1)} / ${s.max.toFixed(1)}`;
  },

  renderEvidencias(){
    const wrap = document.getElementById('evidencias-wrap');
    wrap.innerHTML = '';
    let huboFotos = false;
    SCHEMA.categorias.forEach(cat=>{
      const itemsConFoto = cat.items.filter(i => state.items[i.id] && state.items[i.id].fotos && state.items[i.id].fotos.length);
      if (!itemsConFoto.length) return;
      huboFotos = true;
      const titulo = document.createElement('div');
      titulo.className = 'evidencia-cat-title';
      titulo.textContent = cat.nombre;
      wrap.appendChild(titulo);
      const grid = document.createElement('div');
      grid.className = 'evidencia-grid';
      wrap.appendChild(grid);
      itemsConFoto.forEach(async i=>{
        for (const key of state.items[i.id].fotos){
          const dataUrl = await leerFoto(key);
          if (!dataUrl) continue;
          const img = document.createElement('img');
          img.src = dataUrl;
          img.title = i.nombre;
          grid.appendChild(img);
        }
      });
    });
    if (!huboFotos) wrap.innerHTML = '<div class="empty-note">Aún no hay fotos de evidencia. Agrégalas desde cada ítem en la pestaña Auditoría.</div>';
  },

  // ── Hallazgos / Recomendaciones ──
  categoriasConHallazgo(){
    return SCHEMA.categorias.map(cat=>{
      const itemsCat = cat.items;
      const conFalla = itemsCat.filter(i=>{
        const ev = state.items[i.id];
        return ev && (ev.calificacion==='parcial' || ev.calificacion==='no_cumple');
      });
      const conRecomendacion = itemsCat.filter(i=>{
        const ev = state.items[i.id];
        return ev && ev.calificacion==='no_aplica' && ev.observacion && ev.observacion.trim();
      });
      return {cat, conFalla, conRecomendacion};
    });
  },

  renderHallazgos(){
    const wrap = document.getElementById('hallazgos-wrap');
    wrap.innerHTML = '';
    const data = this.categoriasConHallazgo();
    data.forEach(({cat, conFalla, conRecomendacion})=>{
      if (!conFalla.length && !conRecomendacion.length){
        const div = document.createElement('div');
        div.className = 'categoria-vacia';
        div.textContent = cat.nombre + ' — sin hallazgos';
        wrap.appendChild(div);
        return;
      }
      if (conFalla.length){
        wrap.appendChild(this.crearHallazgoCard(cat, conFalla, 'HALLAZGO'));
      }
      if (conRecomendacion.length){
        wrap.appendChild(this.crearHallazgoCard(cat, conRecomendacion, 'RECOMENDACIÓN'));
      }
    });
  },

  crearHallazgoCard(cat, items, tipo){
    const key = cat.id + '|' + tipo;
    const criticidad = tipo==='RECOMENDACIÓN' ? 'BAJA' : (items.some(i=>i.pts>=10) ? 'ALTA' : 'MEDIA');
    const compPrevio = state.compromisos[key] || {};
    const descAuto = items.map(i=>{
      const ev = state.items[i.id];
      return `${i.nombre}: ${ev.observacion || '(sin observación)'}`;
    }).join('\n');

    const div = document.createElement('div');
    div.className = 'card hallazgo-card' + (tipo==='RECOMENDACIÓN' ? ' recomendacion' : '');
    div.innerHTML = `
      <div class="card-header">
        <span>${cat.nombre} — ${tipo}</span>
        <span class="badge-tag">Criticidad ${criticidad}</span>
      </div>
      <div class="card-body">
        <div class="obs-label">Descripción</div>
        <textarea class="obs-input" data-key="${key}" data-field="descripcion">${compPrevio.descripcion || descAuto}</textarea>
        <div class="form-grid" style="margin-top:12px">
          <div class="form-group">
            <label>Responsable de acción</label>
            <input data-key="${key}" data-field="responsable" value="${compPrevio.responsable || state.datos.jefeCocina || ''}">
          </div>
          <div class="form-group">
            <label>Responsable de seguimiento</label>
            <input data-key="${key}" data-field="responsableSeguimiento" value="${compPrevio.responsableSeguimiento || ''}">
          </div>
          <div class="form-group">
            <label>Área ejecutora</label>
            <select data-key="${key}" data-field="areaEjecutora">
              ${['PDV / Punto de venta','Mantenimiento','Compras','Operaciones','Calidad','Otro'].map(o=>`<option ${compPrevio.areaEjecutora===o?'selected':''}>${o}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>Fecha compromiso *</label>
            <input type="date" data-key="${key}" data-field="fechaCompromiso" value="${compPrevio.fechaCompromiso || ''}" required>
          </div>
        </div>
      </div>
    `;
    div.querySelectorAll('[data-key]').forEach(el=>{
      el.addEventListener('input', ()=>{
        state.compromisos[key] = state.compromisos[key] || {categoriaId:cat.id, tipo};
        state.compromisos[key][el.dataset.field] = el.value;
        state.compromisos[key].criticidad = criticidad;
      });
    });
    if (!state.compromisos[key]){
      state.compromisos[key] = {categoriaId:cat.id, tipo, descripcion:descAuto, responsable:state.datos.jefeCocina||'', responsableSeguimiento:'', areaEjecutora:'PDV / Punto de venta', fechaCompromiso:'', criticidad};
    }
    return div;
  },

  // ── Resumen ──
  renderResumen(){
    const wrap = document.getElementById('resumen-wrap');
    const g = calcularScoreGlobal();
    const clas = clasificar(g.pct);
    let html = `
      <div class="card">
        <div class="score-global">
          <div class="num">${g.pct.toFixed(1)}%</div>
          <div class="clas ${clas.css}">${clas.label}</div>
          <div style="margin-top:8px;color:var(--gray);font-size:12px">${g.obtenido.toFixed(1)} / ${g.max.toFixed(1)} puntos aplicables</div>
        </div>
      </div>
      <div class="card"><div class="card-header">Resultado por categoría</div>`;
    SCHEMA.categorias.forEach(cat=>{
      const s = calcularScorePorCategoria(cat.id);
      let texto;
      if (s.estado === 'pendiente') texto = 'Pendiente por calificar';
      else if (s.estado === 'no_aplica') texto = 'No aplica (todos los ítems)';
      else texto = s.pct.toFixed(1)+'% · '+clasificar(s.pct).label;
      html += `<div class="mod-row"><span>${cat.nombre}</span><span class="pct">${texto}</span></div>`;
    });
    html += `</div>`;

    const hallazgos = Object.values(state.compromisos).filter(c=>c.tipo==='HALLAZGO');
    const recos = Object.values(state.compromisos).filter(c=>c.tipo==='RECOMENDACIÓN');
    html += `<div class="card"><div class="card-header">Hallazgos (${hallazgos.length})</div><div class="card-body">`;
    html += hallazgos.length ? hallazgos.map(h=>`<div class="mod-row"><span>${h.descripcion.split('\n')[0]}</span><span>${h.responsable||'—'} · ${h.fechaCompromiso||'sin fecha'}</span></div>`).join('') : '<div class="empty-note">Sin hallazgos</div>';
    html += `</div></div>`;
    html += `<div class="card"><div class="card-header">Recomendaciones (${recos.length})</div><div class="card-body">`;
    html += recos.length ? recos.map(h=>`<div class="mod-row"><span>${h.descripcion.split('\n')[0]}</span><span>${h.responsable||'—'} · ${h.fechaCompromiso||'sin fecha'}</span></div>`).join('') : '<div class="empty-note">Sin recomendaciones</div>';
    html += `</div></div>`;
    wrap.innerHTML = html;
  },

  // ── Informe ejecutivo / Acta de Compromisos ──
  async construirActaHTML(){
    const g = calcularScoreGlobal();
    const clas = clasificar(g.pct);
    state.retro = document.getElementById('r-retro') ? document.getElementById('r-retro').value : state.retro;
    state.novedades = document.getElementById('r-novedades') ? document.getElementById('r-novedades').value : state.novedades;
    const d = state.datos;

    let filasItems = '';
    SCHEMA.categorias.forEach(cat=>{
      cat.items.forEach(i=>{
        const ev = state.items[i.id] || {};
        const labelCal = {cumple:'Cumple', parcial:'Cumple parcialmente', no_cumple:'No cumple', no_aplica:'No aplica'}[ev.calificacion] || '—';
        const ptsObt = ev.calificacion==='cumple' ? i.pts : ev.calificacion==='parcial' ? i.pts*0.5 : 0;
        filasItems += `<tr><td>${cat.nombre}</td><td>${i.nombre}</td><td>${labelCal}</td><td>${ev.calificacion==='no_aplica'?'—':ptsObt}</td><td>${i.pts}</td><td>${ev.observacion||''}</td></tr>`;
      });
    });

    const compromisos = Object.values(state.compromisos).filter(c=>c.fechaCompromiso || c.descripcion);
    let filasCompromisos = compromisos.map(c=>
      `<tr><td>${c.tipo}</td><td>${c.descripcion.split('\n')[0]}</td><td>${c.responsable||''}</td><td>${c.responsableSeguimiento||''}</td><td>${c.areaEjecutora||''}</td><td>${c.fechaCompromiso||''}</td></tr>`
    ).join('');

    let fotosHtml = '';
    for (const cat of SCHEMA.categorias){
      const itemsConFoto = cat.items.filter(i => state.items[i.id] && state.items[i.id].fotos && state.items[i.id].fotos.length);
      if (!itemsConFoto.length) continue;
      let imgsCat = '';
      for (const i of itemsConFoto){
        for (const key of state.items[i.id].fotos){
          const dataUrl = await leerFoto(key);
          if (!dataUrl) continue;
          imgsCat += `<img src="${dataUrl}" style="width:140px;height:140px;object-fit:cover;border-radius:6px;border:1px solid #ccc;margin:4px" title="${i.nombre}">`;
        }
      }
      if (imgsCat) fotosHtml += `<p style="font-weight:700;margin-top:10px">${cat.nombre}</p><div>${imgsCat}</div>`;
    }

    return `
      <div style="text-align:center;border-bottom:3px solid #F59E0B;padding-bottom:12px;margin-bottom:16px">
        <h2 style="color:#c9790a">🍺 BBC Colombia · Temple Colombia</h2>
        <h3>Acta de Compromisos — Auditoría de Cocina</h3>
      </div>
      <table class="acta-tabla">
        <tr><th>PDV</th><td>${d.pdv}</td><th>Fecha</th><td>${d.fecha} ${d.hora}</td></tr>
        <tr><th>Tipo PDV</th><td>${d.tipoPdv}</td><th>Modalidad</th><td>${d.modalidad}</td></tr>
        <tr><th>Auditor</th><td>${d.auditor}</td><th>Manager</th><td>${d.manager}</td></tr>
        <tr><th>Jefe de Cocina</th><td>${d.jefeCocina}</td><th>Coordinador Zona</th><td>${d.coordinadorZona}</td></tr>
        <tr><th>Recibe</th><td colspan="3">${d.receptor}</td></tr>
      </table>

      <h3 style="margin-top:20px">Resultado global: ${g.pct.toFixed(1)}% — ${clas.label}</h3>

      <table class="acta-tabla">
        <thead><tr><th>Categoría</th><th>Ítem</th><th>Calificación</th><th>Pts obtenidos</th><th>Pts máx</th><th>Observación</th></tr></thead>
        <tbody>${filasItems}</tbody>
      </table>

      <h3 style="margin-top:20px">Compromisos</h3>
      <table class="acta-tabla">
        <thead><tr><th>Tipo</th><th>Descripción</th><th>Responsable</th><th>Seguimiento</th><th>Área ejecutora</th><th>Fecha compromiso</th></tr></thead>
        <tbody>${filasCompromisos || '<tr><td colspan="6">Sin compromisos registrados</td></tr>'}</tbody>
      </table>

      <h3 style="margin-top:20px">Retroalimentación / Capacitación ejecutada</h3>
      <p>${state.retro || '—'}</p>
      <h3 style="margin-top:12px">Novedades y observaciones generales</h3>
      <p>${state.novedades || '—'}</p>

      <h3 style="margin-top:20px">Evidencias fotográficas</h3>
      ${fotosHtml || '<p style="color:#666">Sin fotos de evidencia registradas</p>'}

      <div class="firma-box">
        <div class="firma-linea">Firma Auditor<br>${d.auditor}</div>
        <div class="firma-linea">Firma Manager / Receptor<br>${d.receptor || d.manager}</div>
      </div>
    `;
  },

  async renderInforme(){
    document.getElementById('informe-preview').innerHTML = `<div class="card"><div class="card-body">Generando informe…</div></div>`;
    const html = await this.construirActaHTML();
    document.getElementById('informe-preview').innerHTML = `<div class="card"><div class="card-body">${html}</div></div>`;
    document.getElementById('acta-print').innerHTML = html;
  },

  async enviarCorreo(){
    const d = state.datos;
    const asunto = `Auditoría Cocina — ${d.pdv} — ${d.fecha}`;

    const destinatarios = prompt('¿A qué correo(s) enviar el Acta de Compromisos? (separa varios con coma)', '');
    if (!destinatarios) return;

    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PEGAR_AQUI') >= 0){
      toast('⚠ Falta configurar la URL del Apps Script');
      return;
    }

    toast('Enviando correo con el PDF adjunto…');
    const actaHtml = await this.construirActaHTML();
    try{
      await fetch(APPS_SCRIPT_URL, {
        method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({token: APPS_TOKEN, action:'enviar_acta_pdf', actaHtml, destinatarios, asunto})
      });
      toast('✓ Enviado — revisa la bandeja de ' + destinatarios + ' en unos segundos');
    }catch(e){
      toast('⚠ Error de conexión al enviar el correo');
    }
  },

  // ── Guardar progreso / Cargar / Nueva ──
  guardarProgreso(mostrarToast){
    this.leerDatosGenerales();
    if (!state.id) state.id = uid();
    if (!state.creadoEn) state.creadoEn = new Date().toISOString();
    const db = leerDB();
    const idx = db.findIndex(r=>r.id===state.id);
    const registro = {...JSON.parse(JSON.stringify(state)), estadoLocal:'borrador', actualizadoEn:new Date().toISOString()};
    if (idx>=0) db[idx] = registro; else db.push(registro);
    guardarDB(db);
    localStorage.setItem(LS_DRAFT_ACTIVO, state.id);
    if (mostrarToast) toast('✓ Progreso guardado localmente');
  },

  cargarBorradorActivo(){
    const activoId = localStorage.getItem(LS_DRAFT_ACTIVO);
    if (!activoId) return;
    const db = leerDB();
    const registro = db.find(r=>r.id===activoId && r.estadoLocal==='borrador');
    if (registro) this.cargarRegistro(registro);
  },

  cargarRegistro(registro){
    state = JSON.parse(JSON.stringify(registro));
    Object.keys(state.datos).forEach(k=>{
      const el = document.getElementById('g-'+k);
      if (el) el.value = state.datos[k] || '';
    });
    if (Object.keys(state.items).length){
      document.getElementById('evaluacion-wrap').style.display = 'block';
      this.renderItemActual();
    }
    actualizarAnillo();
    this.cerrarModal();
    toast('Auditoría cargada: ' + (state.datos.pdv || 'sin PDV'));
  },

  abrirModalCargar(){
    const db = leerDB().filter(r=>r.estadoLocal==='borrador');
    const wrap = document.getElementById('lista-borradores');
    wrap.innerHTML = db.length ? db.map(r=>`
      <div class="draft-item" onclick='AppUI.cargarRegistroPorId("${r.id}")'>
        <div class="pdv">${r.datos.pdv || 'Sin PDV'}</div>
        <div class="meta">${r.datos.fecha||''} · Actualizado ${new Date(r.actualizadoEn).toLocaleString('es-CO')}</div>
      </div>
    `).join('') : '<div class="empty-note">No hay auditorías guardadas</div>';
    document.getElementById('modal-cargar').classList.add('show');
  },

  cargarRegistroPorId(id){
    const registro = leerDB().find(r=>r.id===id);
    if (registro) this.cargarRegistro(registro);
  },

  cerrarModal(){ document.getElementById('modal-cargar').classList.remove('show'); },

  confirmarNueva(){
    if (state.id && Object.keys(state.items).length){
      if (!confirm('¿Descartar la auditoría actual y empezar una nueva? (lo ya guardado como progreso se conserva en "Cargar auditoría")')) return;
    }
    this.guardarProgreso(false);
    localStorage.removeItem(LS_DRAFT_ACTIVO);
    location.reload();
  },

  // ── Guardado final: envía a Apps Script ──
  async guardarYFinalizar(){
    this.leerDatosGenerales();
    if (!state.datos.pdv || !state.datos.auditor){ toast('Completa PDV y Auditor antes de guardar'); this.irATab(1); return; }
    if (avanceItems()<100){ toast('Debes calificar el 100% de los ítems antes de finalizar'); this.irATab(1); return; }

    const g = calcularScoreGlobal();
    const clas = clasificar(g.pct);
    state.retro = document.getElementById('r-retro').value;
    state.novedades = document.getElementById('r-novedades').value;

    const auditoria = {
      id: state.id, tipo:'cocina', pdv: state.datos.pdv, zona:'', modalidad: state.datos.modalidad,
      tipoPdv: state.datos.tipoPdv, fecha: state.datos.fecha, hora: state.datos.hora,
      auditor: state.datos.auditor, manager: state.datos.manager, coordinadorZona: state.datos.coordinadorZona,
      receptor: state.datos.receptor,
      camposAdicionales: JSON.stringify({jefeCocina: state.datos.jefeCocina}),
      scoreTotal: g.obtenido, scoreMax: g.max, scorePct: g.pct.toFixed(1),
      clasificacion: clas.label, itemsEvaluados: JSON.stringify(state.items),
      creadoEn: state.creadoEn || new Date().toISOString()
    };

    const hallazgos = [];
    const compromisosPayload = [];
    Object.entries(state.compromisos).forEach(([key, c])=>{
      if (!c.descripcion) return;
      const hallazgoId = uid();
      hallazgos.push({
        id: hallazgoId, auditId: state.id, auditTipo:'cocina', pdv: state.datos.pdv, zona:'',
        coordinador: state.datos.coordinadorZona, categoriaId: c.categoriaId,
        categoriaNombre: (SCHEMA.categorias.find(cat=>cat.id===c.categoriaId)||{}).nombre || c.categoriaId,
        descripcion: c.descripcion, criticidad: c.criticidad, tipo: c.tipo,
        creadoEn: new Date().toISOString()
      });
      compromisosPayload.push({
        id: uid(), hallazgoId, auditId: state.id, pdv: state.datos.pdv, zona:'',
        coordinador: state.datos.coordinadorZona, auditTipo:'cocina', categoriaId: c.categoriaId,
        descripcionAccion: c.descripcion, responsable: c.responsable, areaEjecutora: c.areaEjecutora,
        fechaCompromiso: c.fechaCompromiso, estado: c.tipo==='RECOMENDACIÓN' ? 'RECOMENDACIÓN' : 'ABIERTO',
        evidencias: JSON.stringify([]), reincidenciaCount: 0, fechaCierre:'', evidenciaCierre:'',
        validadoPor:'', pdfEnviado:false, tipo:'COMPROMISO', creadoEn: new Date().toISOString(),
        responsableSeguimiento: c.responsableSeguimiento||''
      });
    });

    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PEGAR_AQUI') >= 0){
      toast('⚠ Falta configurar la URL del Apps Script — guardado solo localmente');
    } else {
      try{
        await fetch(APPS_SCRIPT_URL, {
          method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({token: APPS_TOKEN, action:'save_auditoria', auditoria, hallazgos, compromisos: compromisosPayload})
        });
        toast('✓ Auditoría enviada a Google Sheets');
      }catch(e){ toast('⚠ Error de conexión — quedó guardada localmente'); }
    }

    // Marcar como guardado localmente (deja de ser borrador)
    const db = leerDB();
    const idx = db.findIndex(r=>r.id===state.id);
    const registroFinal = {...JSON.parse(JSON.stringify(state)), estadoLocal:'guardado', actualizadoEn:new Date().toISOString()};
    if (idx>=0) db[idx] = registroFinal; else db.push(registroFinal);
    guardarDB(db);
    localStorage.removeItem(LS_DRAFT_ACTIVO);
  }
};

window.addEventListener('DOMContentLoaded', ()=>AppUI.init());
</script>
</body>
</html>
